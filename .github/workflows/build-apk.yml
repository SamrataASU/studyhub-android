name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Name the file
        run: cp app/build/outputs/apk/debug/app-debug.apk StudyHub.apk

      - name: Keep a copy with this build
        uses: actions/upload-artifact@v4
        with:
          name: StudyHub-apk
          path: StudyHub.apk

      - name: Publish a download link (Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Test build ${{ github.run_number }}
          body: |
            Test version for Android. Download **StudyHub.apk** below, open it on your phone,
            allow "Install unknown apps" when asked, then tap Install.
          files: StudyHub.apk
          prerelease: true
